version: "2"

run:
  concurrency: 4
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - dupl
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - maintidx
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    cyclop:
      max-complexity: 15
      package-average: 10.0
    dupl:
      threshold: 100
    maintidx:
      under: 20
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
